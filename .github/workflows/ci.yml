name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm test runs .ts files directly, which needs Node's built-in type stripping (22.18+).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test
      - name: PHP syntax
        run: for f in PHP/*.php; do php -l "$f"; done
